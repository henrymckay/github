[project]
name = "reading-list"
version = "0.1.0"
description = "A small local web app for keeping a reading list."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.165.0",
  "jinja2>=3.1.6",
  "platformdirs>=4.14.8",
  "python-multipart>=0.0.34",
  "typer>=0.29.2",
  "uvicorn>=0.54.0",
]

[project.scripts]
reading-list = "reading_list.code.drive.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM", "C4", "RUF", "PT", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
reportMissingTypeStubs = false
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--import-mode importlib --strict-config --strict-markers -p pytest_.given"
filterwarnings = ["error"]
markers = ["slow: opt in with -m slow"]
pythonpath = ["tests"]
testpaths = ["tests/suite"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["reading_list"]

[tool.coverage.report]
exclude_also = ["case _:\\s*\\n\\s*typing.assert_never", "typing.assert_never"]
fail_under = 99
show_missing = true

[dependency-groups]
dev = [
  "coverage>=7.17.4",
  "httpx2>=2.16.2",
  "pre-commit>=4.7.0",
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "ruff>=0.17.6",
  "taplo>=0.9.3",
]
