<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your reading list: books, progress and stats.">
  <title>{% block title %}Reading list{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (ignored) {}
  </script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v17H5.5A1.5 1.5 0 0 1 4 18.5zM13 3h5.5A1.5 1.5 0 0 1 20 4.5v14a1.5 1.5 0 0 1-1.5 1.5H13z" fill="currentColor"/></svg>
        Reading list
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Library</a>
        <a href="/stats" {% if path == "/stats" %}aria-current="page"{% endif %}>Stats</a>
      </nav>
      <button class="theme" type="button" data-theme-toggle aria-label="Switch between light and dark">
        <svg class="icon-moon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <svg class="icon-sun" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
